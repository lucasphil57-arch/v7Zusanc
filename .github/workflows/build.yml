name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: test
        run: dotnet test -v q --nologo
      - name: publish
        run: dotnet publish src/Argos.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: Argos-exe
          path: dist/Argos.exe